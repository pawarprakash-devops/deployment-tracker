name: Deploy to Vercel
run-name: "Deploy: ${{ github.event.head_commit.message }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $DEPLOYMENT_URL"

      - name: Log deployment to tracker
        if: success()
        continue-on-error: true
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -n1 | sed 's/"/\\"/g')
          
          curl -X POST "${{ secrets.TRACKER_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.TRACKER_WEBHOOK_SECRET }}" \
            -d "{
              \"environment\": \"Production\",
              \"status\": \"Success\",
              \"branch\": \"${{ github.ref_name }}\",
              \"version\": \"${{ github.sha }}\",
              \"requested_by\": \"${{ github.actor }}\",
              \"deployed_by\": \"GitHub Actions - Deployment Tracker\",
              \"ticket_link\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"notes\": \"Auto-deploy: ${COMMIT_MSG}\",
              \"started_at\": \"${TIMESTAMP}\"
            }"

      - name: Comment on commit
        if: success()
        continue-on-error: true
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Production URL: ${{ steps.deploy.outputs.url }}"
          echo "📊 Dashboard: https://deployment-tracker-taupe.vercel.app"
