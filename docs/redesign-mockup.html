<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{
  color-scheme: light;
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#eef1f7; --text:#161c2b; --muted:#4f5a70; --border:#cfd5e2;
  --brand:#2848c9; --on-brand:#ffffff; --brand-soft:#e5ebff; --focus:#1a3bd0;
  --ok-bg:#dff3e7; --ok-fg:#0a6034; --warn-bg:#fdecc8; --warn-fg:#7a4200; --bad-bg:#fbe0dd; --bad-fg:#a61f17;
  --info-bg:#e1e9ff; --info-fg:#1e3fb4; --neu-bg:#e8ebf2; --neu-fg:#3f485b;
  --shadow:0 1px 2px rgba(20,28,50,.08),0 4px 14px rgba(20,28,50,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme='light']){
    color-scheme: dark;
    --bg:#0d1017; --surface:#161a24; --surface2:#1e2330; --text:#e8ebf3; --muted:#a6b0c6; --border:#303850;
    --brand:#8da6ff; --on-brand:#0d1017; --brand-soft:#232d55; --focus:#a9bbff;
    --ok-bg:#12321f; --ok-fg:#76e0a6; --warn-bg:#3a2a0b; --warn-fg:#f6c874; --bad-bg:#40181a; --bad-fg:#ffa39c;
    --info-bg:#1b2a58; --info-fg:#a5bcff; --neu-bg:#272d3c; --neu-fg:#c3cada;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme='dark']{
  color-scheme: dark;
  --bg:#0d1017; --surface:#161a24; --surface2:#1e2330; --text:#e8ebf3; --muted:#a6b0c6; --border:#303850;
  --brand:#8da6ff; --on-brand:#0d1017; --brand-soft:#232d55; --focus:#a9bbff;
  --ok-bg:#12321f; --ok-fg:#76e0a6; --warn-bg:#3a2a0b; --warn-fg:#f6c874; --bad-bg:#40181a; --bad-fg:#ffa39c;
  --info-bg:#1b2a58; --info-fg:#a5bcff; --neu-bg:#272d3c; --neu-fg:#c3cada;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:8px;top:-60px;background:var(--brand);color:var(--on-brand);padding:8px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}

/* shell */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);grid-template-areas:"top top" "nav main";min-height:100vh}
.top{grid-area:top;position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:16px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:4px}
.logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--brand);color:var(--on-brand);font-style:normal;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;background:var(--surface2);padding:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;color:var(--muted);font-weight:600}
.seg button[aria-checked='true']{background:var(--brand);color:var(--on-brand)}
.seg .s{display:none}
.search{position:relative;flex:1 1 220px;max-width:430px;min-width:0}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:var(--text)}
.search input::placeholder{color:var(--muted);opacity:1}
.search .ic{position:absolute;left:10px;top:7px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:40;padding:4px}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px}
.results button:hover{background:var(--surface2)}
.results .none{padding:10px;color:var(--muted)}
.envs{display:flex;gap:6px;align-items:center;margin-left:auto}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;line-height:1}
.dot.ok{background:var(--ok-bg);color:var(--ok-fg)} .dot.warn{background:var(--warn-bg);color:var(--warn-fg)} .dot.bad{background:var(--bad-bg);color:var(--bad-fg)}
.iconbtn{border:1px solid var(--border);background:var(--surface2);border-radius:9px;padding:6px 10px;font-weight:600}
.nav{grid-area:nav;background:var(--surface);border-right:1px solid var(--border);padding:12px 10px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:600;margin-bottom:2px}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current='page']{background:var(--brand-soft);color:var(--brand)}
.nav .g{width:20px;text-align:center}
main{grid-area:main;padding:20px 24px 40px;min-width:0}
main:focus{outline:none}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:16px}
.phead h1{margin:0;font-size:22px}
.phead p{margin:2px 0 0;color:var(--muted)}
.phead .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}

/* components */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));margin-bottom:14px}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.grid.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .cnt{font-weight:600;color:var(--muted);font-size:13px}
.card .sub{color:var(--muted);margin:-4px 0 10px;font-size:13px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)} .pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.neu{background:var(--neu-bg);color:var(--neu-fg)}
.pill .i{font-size:11px}
.pill.run .i{display:inline-block}
@media (prefers-reduced-motion: no-preference){
  .pill.run .i{animation:spin 1.6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .drawer{transition:transform .18s ease}
  .scrim{transition:opacity .18s ease}
}
.chip{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-variant-numeric:tabular-nums;color:var(--text)}
.tcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:none}
.tcard:hover{border-color:var(--brand)}
.tcard .k{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.tcard .t{display:block;margin:2px 0 6px;overflow-wrap:anywhere}
.tcard .m{display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;margin-bottom:14px;border:1px solid var(--bad-fg);background:var(--bad-bg);color:var(--bad-fg);font-weight:600}
.banner button{margin-left:auto;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:3px 10px;font-weight:700}
.tile .lab{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tile .val{font-size:26px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.tile .delta{font-size:12px;font-weight:700}
.tile svg{display:block;width:100%;height:36px;color:var(--brand);margin-top:6px}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.bar>span{display:block;height:100%;background:var(--brand)}
.hbars{display:grid;gap:8px}
.hbars .r{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center}
.cd{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.fchip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;color:var(--text)}
.fchip[aria-pressed='true']{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fchip[aria-pressed='true']::before{content:"\2713\00a0"}
.more{margin-bottom:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.more select{padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}
.link{border:0;background:none;color:var(--brand);text-decoration:underline;padding:0;font-weight:600}
.link.k{font-variant-numeric:tabular-nums}

/* tables */
.tw{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--surface2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
body[data-density='compact'] th, body[data-density='compact'] td{padding:4px 10px}
body[data-density='compact'] .tcard{padding:6px 8px}
body[data-density='compact'] .tcard .t{margin-bottom:3px}

/* board */
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border:1px solid var(--border);border-radius:12px;min-width:0;align-self:start}
.col>button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 12px;text-align:left;font-weight:700;border-radius:12px}
.col .when{display:block;font-weight:500;color:var(--muted);font-size:12px}
.col .chev{margin-left:auto;display:none}
.col .cb{padding:0 8px 8px;display:grid;gap:8px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,8,16,.55);z-index:60;opacity:0}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);z-index:61;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow);overflow:auto;padding:16px;transform:translateX(100%)}
.drawer.on{transform:none}
.drawer[hidden],.scrim[hidden]{display:none}
.drawer h2{margin:0 0 4px;font-size:18px;overflow-wrap:anywhere}
.drawer .dh{display:flex;gap:10px;align-items:flex-start}
.drawer .x{margin-left:auto;border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:4px 10px;font-weight:700}
.steps{list-style:none;margin:12px 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps li{text-align:center;font-size:12px;position:relative;padding-top:2px}
.steps .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;margin:0 auto 4px;font-weight:700;border:2px solid var(--border);background:var(--surface);color:var(--muted)}
.steps .done .n{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-fg)}
.steps .cur .n{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-fg)}
.steps li:not(:last-child)::after{content:"";position:absolute;top:16px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:var(--border)}
.steps .done:not(:last-child)::after{background:var(--ok-fg)}
.steps .st{display:block;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:12px 0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:9px;z-index:90;max-width:90vw}
.toast[hidden]{display:none}
.mock{font-size:12px;color:var(--muted);margin-top:24px}

/* responsive */
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .top{padding:8px 16px}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:35;display:flex;justify-content:space-around;border-right:0;border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .nav a{flex-direction:column;gap:0;font-size:11px;padding:6px 4px;margin:0;flex:1;text-align:center;min-width:0}
  main{padding:16px 16px 96px}
  .envs{margin-left:0}
  .seg button{padding:6px 9px}
  .seg .l{display:none} .seg .s{display:inline}
  .board{display:block;overflow:visible}
  .col{margin-bottom:10px}
  .col .chev{display:inline}
  .col.collapsed .cb{display:none}
  .toast{bottom:84px}
}
@media (min-width:900px){ .col.collapsed .cb{display:grid} }
@media (max-width:699px){
  .rt thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .rt, .rt tbody, .rt tr, .rt td{display:block;width:100%}
  .rt tr{padding:10px 12px;border-bottom:1px solid var(--border)}
  .rt td{border:0;padding:3px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;text-align:right}
  .rt td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none}
  .rt td > *{min-width:0}
  .phead h1{font-size:19px}
}
</style>

function spark(arr){var w=120,h=36,mn=Math.min.apply(null,arr),mx=Math.max.apply(null,arr),r=(mx-mn)||1;

 d.innerHTML='<div class="dh"><div><div class="row"><span class="chip">'+esc(t.k)+'</span>'+badges(t)+'</div><h2 id="dtitle">'+esc(t.t)+'</h2></div><button type="button" class="x" id="dclose" aria-label="Close ticket details">Close (Esc)</button></div>'+
 '<ol class="steps" aria-label="Release journey">'+steps+'</ol>'+
 '<dl class="kv"><dt>Jira status</dt><dd>'+esc(t.s)+'</dd><dt>Assignee</dt><dd>'+esc(t.a)+'</dd><dt>Type / priority</dt><dd>'+esc(t.ty)+' / '+esc(t.p)+'</dd><dt>Environment</dt><dd>'+esc(envName(t.c))+', '+esc(t.age)+'d in stage</dd><dt>Frontend</dt><dd><span class="chip">'+esc(t.fe)+'</span></dd><dt>Backend</dt><dd><span class="chip">'+esc(t.be)+'</span></dd><dt>Release note</dt><dd>'+esc(t.t)+' (synthetic note text).</dd></dl>'+
 '<div class="row"><button type="button" class="iconbtn" data-toast="Mock: opens Jira">Open in Jira</button><button type="button" class="iconbtn" data-toast="Mock: opens the pull request">Linked PR #'+esc(1000+parseInt(t.k.slice(-3),10))+'</button><button type="button" class="iconbtn" data-toast="Mock: opens the deploy run">Deploy run</button><button type="button" class="iconbtn" id="copylink">Copy link</button></div>';
 var s=$('#scrim');s.hidden=false;d.hidden=false;
 ['top','nav','main'].forEach(function(i){var e=document.getElementById(i);if(e)e.setAttribute('inert','');});
 requestAnimationFrame(function(){s.classList.add('on');d.classList.add('on');$('#dclose').focus();});
}
function closeDrawer(){
 var d=$('#drawer');if(d.hidden)return;
 ['top','nav','main'].forEach(function(i){var e=document.getElementById(i);if(e)e.removeAttribute('inert');});
 d.classList.remove('on');$('#scrim').classList.remove('on');d.hidden=true;$('#scrim').hidden=true;
 var o=lastOpener;lastOpener=null;
 if(o&&document.contains(o)&&o.focus)o.focus();
 else if(o&&o.dataset&&o.dataset.ticket){var again=document.querySelector('[data-ticket="'+o.dataset.ticket.replace(/"/g,'')+'"]');(again||$('#main')).focus();}
 else $('#main').focus();
}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2200);}

/* ---------- search ---------- */
function runSearch(){
 var v=$('#q').value.trim().toLowerCase(),r=$('#results'),q=$('#q');
 if(!v){r.hidden=true;q.setAttribute('aria-expanded','false');return;}
 var hits=T.filter(function(t){return (t.k+' '+t.t+' '+t.a+' '+t.fe+' '+t.be).toLowerCase().indexOf(v)>-1;}).slice(0,8);
 r.innerHTML=hits.length?hits.map(function(t){return '<button type="button" role="option" data-ticket="'+esc(t.k)+'" data-fromsearch="1"><strong>'+esc(t.k)+'</strong> '+esc(t.t)+'<br><span class="muted">'+esc(t.a)+' · '+esc(envName(t.c))+' · BE '+esc(t.be)+'</span></button>';}).join(''):'<div class="none">No matches for "'+esc($('#q').value.trim())+'"</div>';
 r.hidden=false;q.setAttribute('aria-expanded','true');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
 var el=e.target.closest?e.target.closest('button,a'):null;if(!el)return;
 if(el.dataset.ticket){var fs=el.dataset.fromsearch;if(fs){$('#results').hidden=true;$('#q').setAttribute('aria-expanded','false');openDrawer(el.dataset.ticket,$('#q'));}else openDrawer(el.dataset.ticket,el);return;}
 if(el.dataset.lens){setLens(el.dataset.lens,true);return;}
 if(el.dataset.toast){toast(el.dataset.toast);return;}
 if(el.dataset.colbtn){var id=el.dataset.colbtn;state.collapsed[id]=!state.collapsed[id];var c=el.closest('.col');c.classList.toggle('collapsed',state.collapsed[id]);el.setAttribute('aria-expanded',String(!state.collapsed[id]));el.querySelector('.chev').textContent=state.collapsed[id]?'▸':'▾';return;}
 if(el.dataset.chip){var c2=el.dataset.chip;if(c2==='all')state.chips={};else if(state.chips[c2])delete state.chips[c2];else state.chips[c2]=1;refreshTickets();var nb=$('[data-chip="'+c2+'"]');if(nb)nb.focus();return;}
 if(el.id==='dclose'){closeDrawer();return;}
 if(el.id==='copylink'){var url=location.href;try{navigator.clipboard.writeText(url).then(function(){toast('Link copied');},function(){toast('Copy not available here');});}catch(x){toast('Copy not available here');}return;}
 if(el.id==='theme'){setTheme(isDark()?'light':'dark');return;}
 if(el.id==='refresh'){state.updated=Date.now();tick();toast('Refreshed (synthetic data)');return;}
 if(el.id==='density'){var cp=document.body.getAttribute('data-density')!=='compact';document.body.setAttribute('data-density',cp?'compact':'comfortable');store('vt-density',cp?'compact':'comfortable');el.setAttribute('aria-pressed',String(cp));return;}
 if(!e.target.closest('.search'))$('#results').hidden=true;
});
document.addEventListener('click',function(e){if(e.target.id==='scrim')closeDrawer();if(!e.target.closest('.search')){var r=$('#results');if(r)r.hidden=true;}});
function refreshTickets(){
 var tb=$('#tbody');if(!tb)return;tb.innerHTML=ticketRows();$('#tcount').textContent=filterTickets().length+' of '+T.length+' tickets';
 Array.prototype.forEach.call(document.querySelectorAll('.fchip'),function(b){var k=b.dataset.chip;b.setAttribute('aria-pressed',String(k==='all'?!Object.keys(state.chips).length:!!state.chips[k]));});
}
document.addEventListener('change',function(e){if(e.target.id==='envsel'){state.env=e.target.value;refreshTickets();}});
$('#q').addEventListener('input',runSearch);
$('#q').addEventListener('keydown',function(e){
 if(e.key==='Enter'){var f=$('#results [data-ticket]');if(f){e.preventDefault();$('#results').hidden=true;openDrawer(f.dataset.ticket,$('#q'));}}
 if(e.key==='Escape'){$('#results').hidden=true;this.setAttribute('aria-expanded','false');}
 if(e.key==='ArrowDown'){var f2=$('#results [data-ticket]');if(f2){e.preventDefault();f2.focus();}}
});
document.addEventListener('keydown',function(e){
 var d=$('#drawer');
 if(e.key==='Escape'&&!d.hidden){e.preventDefault();closeDrawer();return;}
 if(e.key==='Tab'&&!d.hidden){var f=d.querySelectorAll('button,[href],input,select');if(!f.length)return;var a=f[0],z=f[f.length-1];
  if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
 if((e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();$('#q').focus();}
 var lg=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.lens;
 if(lg&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();var i=LENSES.map(function(l){return l.id;}).indexOf(lg);i=(i+(e.key==='ArrowRight'?1:LENSES.length-1))%LENSES.length;setLens(LENSES[i].id,true);}
});

/* ---------- init ---------- */
(function init(){
 var th=store('vt-theme');if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th);
 var dn=store('vt-density');if(dn==='compact')document.body.setAttribute('data-density','compact');
 var as=null;try{as=new URL(location.href).searchParams.get('as');}catch(e){}
 var saved=as||store('vt-lens');
 if(LENSES.some(function(l){return l.id===saved;}))state.lens=saved;
 route(true);
})();
})();
</script>
</body>
</html>
